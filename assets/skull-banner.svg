<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#150404"/>
      <stop offset="55%" stop-color="#070101"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#efe9d8"/>
      <stop offset="55%" stop-color="#cfc6a8"/>
      <stop offset="100%" stop-color="#857c5e"/>
    </linearGradient>
    <linearGradient id="jawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8d0b4"/>
      <stop offset="100%" stop-color="#9a9072"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="60%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#8b000000" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="380"/>
    </clipPath>

    <style>
      <![CDATA[
        text { font-family: "Courier New", monospace; }

        @keyframes fall {
          0%   { transform: translateY(-60px); opacity: 0; }
          10%  { opacity: 0.9; }
          85%  { opacity: 0.9; }
          100% { transform: translateY(420px); opacity: 0; }
        }
        .glyph { fill: #4d0000; font-size: 15px; animation: fall linear infinite; }
        .glyph.bright { fill: #b81414; }

        @keyframes jaw {
          0%   { transform: rotate(0deg) translateY(0); }
          12%  { transform: rotate(13deg) translateY(10px); }
          28%  { transform: rotate(15deg) translateY(12px); }
          42%  { transform: rotate(3deg) translateY(2px); }
          55%  { transform: rotate(14deg) translateY(11px); }
          72%  { transform: rotate(14deg) translateY(11px); }
          85%  { transform: rotate(1deg) translateY(0); }
          100% { transform: rotate(0deg) translateY(0); }
        }
        .jaw-group { transform-origin: 500px 248px; animation: jaw 4.2s cubic-bezier(.5,0,.3,1) infinite; }

        @keyframes pulse {
          0%, 100% { opacity: 0.65; }
          50% { opacity: 1; }
        }
        .eye-core { animation: pulse 2.4s ease-in-out infinite; }
        .eye-core.r { animation-delay: 0.3s; }

        @keyframes breathe {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-4px); }
        }
        .skull-rig { animation: breathe 5s ease-in-out infinite; }

        @keyframes flicker {
          0%, 91%, 100% { opacity: 1; }
          92% { opacity: 0.35; }
          93% { opacity: 1; }
          95% { opacity: 0.5; }
          96% { opacity: 1; }
        }
        .title { animation: flicker 6s infinite; }
      ]]>
    </style>
  </defs>

  <rect width="1000" height="380" fill="url(#bgGlow)"/>

  <!-- digital rain -->
  <g clip-path="url(#frame)">
    <text class="glyph" x="30" y="0" style="animation-duration:3.4s; animation-delay:-0.2s">ﾊ</text>
    <text class="glyph bright" x="70" y="0" style="animation-duration:4.1s; animation-delay:-1.6s">01</text>
    <text class="glyph" x="110" y="0" style="animation-duration:2.9s; animation-delay:-0.9s">ﾐ</text>
    <text class="glyph" x="150" y="0" style="animation-duration:3.7s; animation-delay:-2.4s">ﾆ</text>
    <text class="glyph bright" x="190" y="0" style="animation-duration:3.1s; animation-delay:-0.4s">ﾜ</text>
    <text class="glyph" x="225" y="0" style="animation-duration:4.4s; animation-delay:-3.0s">ﾂ</text>
    <text class="glyph" x="780" y="0" style="animation-duration:3.3s; animation-delay:-1.1s">ﾇ</text>
    <text class="glyph bright" x="815" y="0" style="animation-duration:3.9s; animation-delay:-0.6s">10</text>
    <text class="glyph" x="850" y="0" style="animation-duration:2.8s; animation-delay:-2.1s">ﾑ</text>
    <text class="glyph" x="890" y="0" style="animation-duration:4.0s; animation-delay:-1.4s">ﾅ</text>
    <text class="glyph bright" x="925" y="0" style="animation-duration:3.5s; animation-delay:-2.8s">ﾗ</text>
    <text class="glyph" x="960" y="0" style="animation-duration:3.0s; animation-delay:-0.7s">ﾒ</text>
    <text class="glyph" x="15" y="0" style="animation-duration:3.6s; animation-delay:-1.9s">ｸ</text>
    <text class="glyph bright" x="975" y="0" style="animation-duration:4.3s; animation-delay:-0.3s">00</text>
  </g>

  <!-- skull rig -->
  <g class="skull-rig">

    <!-- hairline cracks (static, behind cranium for depth) -->
    <g stroke="#3a3220" stroke-width="1.4" fill="none" opacity="0.55">
      <path d="M 470 35 L 455 70 L 468 95"/>
      <path d="M 560 50 L 575 80"/>
    </g>

    <!-- cranium -->
    <path d="M 390 95
             C 390 35, 470 18, 500 18
             C 530 18, 610 35, 610 95
             C 610 148, 582 178, 565 192
             L 565 230
             L 435 230
             L 435 192
             C 418 178, 390 148, 390 95 Z"
          fill="url(#boneGrad)" stroke="#352e1c" stroke-width="3"/>

    <!-- temporal shading -->
    <path d="M 390 95 C 390 60, 415 35, 445 24 C 420 45, 405 75, 410 110 Z" fill="#00000022"/>
    <path d="M 610 95 C 610 60, 585 35, 555 24 C 580 45, 595 75, 590 110 Z" fill="#00000022"/>

    <!-- eye sockets -->
    <ellipse cx="455" cy="128" rx="40" ry="46" fill="#0a0500"/>
    <ellipse cx="545" cy="128" rx="40" ry="46" fill="#0a0500"/>

    <!-- eye glow -->
    <circle cx="455" cy="132" r="26" fill="url(#eyeGlow)" opacity="0.5"/>
    <circle cx="545" cy="132" r="26" fill="url(#eyeGlow)" opacity="0.5"/>
    <circle class="eye-core l" cx="455" cy="132" r="7" fill="#ff2424"/>
    <circle class="eye-core r" cx="545" cy="132" r="7" fill="#ff2424"/>

    <!-- nasal cavity -->
    <path d="M 500 165 L 480 205 L 520 205 Z" fill="#0a0500"/>

    <!-- cheek / maxilla ridge -->
    <path d="M 435 230 L 565 230 L 555 250 L 445 250 Z" fill="#bdb392" stroke="#352e1c" stroke-width="2"/>
    <g fill="#0a0500">
      <rect x="450" y="230" width="6" height="20"/>
      <rect x="468" y="230" width="6" height="20"/>
      <rect x="486" y="230" width="6" height="20"/>
      <rect x="504" y="230" width="6" height="20"/>
      <rect x="522" y="230" width="6" height="20"/>
      <rect x="540" y="230" width="6" height="20"/>
    </g>

    <!-- animated jaw -->
    <g class="jaw-group">
      <path d="M 445 250
               C 432 272, 442 305, 478 316
               L 522 316
               C 558 305, 568 272, 555 250
               L 540 250 L 540 266 L 522 266 L 522 250
               L 504 250 L 504 266 L 486 266 L 486 250
               L 468 250 L 468 266 L 450 266 L 450 250
               Z"
            fill="url(#jawGrad)" stroke="#352e1c" stroke-width="2.5"/>
      <!-- subtle inner shadow for depth when open -->
      <path d="M 460 250 L 540 250 L 535 260 L 465 260 Z" fill="#00000033"/>
    </g>
  </g>

  <!-- title block -->
  <text class="title" x="500" y="345" text-anchor="middle"
        font-size="36" font-weight="bold"
        fill="#8b0000" letter-spacing="5">MR.BORAN</text>
  <text x="500" y="367" text-anchor="middle"
        font-size="13" fill="#5c5c5c" letter-spacing="2">here lies what you could not patch</text>
</svg>
