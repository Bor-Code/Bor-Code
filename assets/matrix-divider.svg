        text { font-family: "Courier New", monospace; font-size: 14px; }
        @keyframes fall2 {
          0%   { transform: translateY(-20px); opacity: 0; }
          15%  { opacity: 0.85; }
          80%  { opacity: 0.85; }
          100% { transform: translateY(110px); opacity: 0; }
        }
        .g { fill: #4d0000; animation: fall2 linear infinite; }
        .g.b { fill: #b81414; }
      ]]>
    </style>
